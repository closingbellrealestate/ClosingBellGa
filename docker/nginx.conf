server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use kube-dns for dynamic upstream resolution
    resolver 10.96.0.10 valid=30s ipv6=off;

    # Never cache index.html so browsers always get the latest entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Same-origin reverse proxy to the API service. This lets clients (especially
    # in-app browsers like Facebook/Instagram WKWebView, where cross-origin XHR
    # to api.closingbellga.com is unreliable due to storage partitioning and
    # bot challenges) call the API as /api/* on the same host.
    location /api/ {
        # Strip the /api prefix when forwarding (API routes live at root, e.g. /listings)
        set $api_upstream "http://api.closingbell.svc.cluster.local:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Angular SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever (Angular adds content hashes to filenames)
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
