server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use kube-dns for dynamic upstream resolution
    resolver 10.96.0.10 valid=30s ipv6=off;

    # Never cache index.html so browsers always get the latest entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Same-origin reverse proxy to the API service. This lets clients (especially
    # in-app browsers like Facebook/Instagram WKWebView, where cross-origin XHR
    # to api.closingbellga.com is unreliable due to storage partitioning and
    # bot challenges) call the API as /api/* on the same host.
    location /api/ {
        # Strip the /api prefix when forwarding (API routes live at root, e.g. /listings)
        set $api_upstream "http://api.closingbell.svc.cluster.local:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 301 every variant to one canonical origin: https://closingbellga.com
    # TLS ends at Cloudflare (tunnel), so the visitor's scheme arrives in
    # X-Forwarded-Proto. Requests without the header (k8s probes) are left alone.
    set $canonical_redirect 0;
    if ($host ~* ^www\.) { set $canonical_redirect 1; }
    if ($http_x_forwarded_proto = "http") { set $canonical_redirect 1; }
    if ($canonical_redirect) { return 301 https://closingbellga.com$request_uri; }

    # Unknown URLs get a real 404 status. The body is still the SPA, which
    # renders its "Page not found" screen for unmatched routes.
    error_page 404 /index.html;

    # Known Angular routes — keep in sync with src/app/app.routes.ts
    location ~ ^/(listings(/[^/]+)?|lp/[^/]+|cq(/.*)?|portal/.*|unauthorized)/?$ {
        try_files $uri /index.html;
    }

    # Everything else: real files only (/, robots.txt, sitemap.xml, assets), else 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache hashed static assets forever (Angular adds content hashes to filenames)
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
