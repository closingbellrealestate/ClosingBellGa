apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: livelyfencing
type: Opaque
stringData:
  # Must be the SAME key the existing data was encrypted with — do not regenerate on migration.
  ENCRYPTION_KEY: "<encryption-key>"
  CONNECTION_STRING: "Host=postgres;Port=5432;Database=livelyfencing;Username=lfuser;Password=<postgres-password>"
  SENDGRID_API_KEY: "<sendgrid-api-key>"
  CF_TEAM_DOMAIN: "<cf-team-domain>"
  CF_AUDIENCE: "<cf-audience>"
  TC_WEBHOOK_SECRET: "<tc-webhook-secret>"
  GOOGLE_PLACES_API_KEY: "<google-places-api-key>"
  GOOGLE_PLACE_ID: "<google-place-id>"
